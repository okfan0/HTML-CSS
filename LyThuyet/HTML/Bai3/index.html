<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device=width, initial=1.0">
    <title>Bài 10</title>
  </head>

  <body>
    <!--
    Thẻ ul unordered list: danh sach không có thứ tự
    Sử dụng kết hợp với các thẻ con để  liệt kê danh sách
    -->
    <ul>
        <li> Item 1</li>
        <li> Item 2</li>
        <li> Item 3</li>
    </ul>

    <!--
    Thẻ ol - ordered list: danh sách có thứ tự
    Sử dụng kết hợp với các thẻ con để liệt kê các danh sách
    -->
    <ol>
        <li> Item 1</li>
        <li> Item 2</li>
        <li> Item 3</li>
    </ol>
    <!--
    Thẻ li: dùng trực tiếp với <ul> và <ol>
    -->
  </body>

</html>
